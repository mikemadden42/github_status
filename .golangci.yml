version: "2"

linters:
  default: none
  enable:
    - errcheck
    - gosec
    - revive
    - govet
  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
  exclusions:
    paths:
      - third_party
      - builtin
      - examples

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mikemadden42
